[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "erabu"
version = "0.1.0"
description = "Expressive Rule-Aware Bundling Utility: optimize selections of tabular candidates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.13"]

[dependency-groups]
dev = ["mypy>=1.11", "pandas-stubs>=2.2", "pytest>=8", "pytest-cov>=5", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/erabu"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "scripts/", "benchmarks/", "docs/", "README.md", "CONTRIBUTING.md", "pyproject.toml", "uv.lock", "mise.toml", ".python-version", ".gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src/erabu", "examples"]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["erabu"]
branch = true
